<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notepad</title>
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#6558d3"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Notepad">
<style>
:root{--ink:#20243a;--muted:#85899c;--line:#eceef4;--accent:#6558d3;--bg:#f5f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}
.app{max-width:560px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 35px #20243a0d}
header{height:62px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px}.brand span{color:var(--accent)}.actions{display:flex;gap:8px}
button,select,input,textarea{font:inherit}.iconbtn{width:39px;height:39px;border:0;border-radius:13px;background:#f2f1fc;color:var(--accent);font-size:22px;cursor:pointer}
.toolbar{display:flex;align-items:center;gap:7px;padding:10px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar select{background:#f6f6fa;border:1px solid #ececf3;border-radius:9px;padding:7px;color:#45495e;font-size:13px}
.color{width:29px;height:29px;border:1px solid #ddd;border-radius:50%;padding:0;background:#34384d}.counter{margin-right:auto;color:var(--muted);font-size:12px}
main{padding:19px 20px 28px;display:flex;flex-direction:column;flex:1}.date{font-size:12px;color:var(--muted);margin-bottom:13px}
#title{font-size:23px;font-weight:750;border:0;outline:0;width:100%;color:var(--ink);margin:0 0 12px;background:transparent}
#body{font:17px/1.9 system-ui,Arial,sans-serif;color:#34384d;border:0;outline:0;resize:none;width:100%;min-height:55vh;background:transparent}
#body::placeholder{color:#b5b8c5}footer{border-top:1px solid var(--line);padding:12px 17px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
.primary{background:var(--accent);color:white;border:0;border-radius:12px;padding:10px 17px;font-weight:650;cursor:pointer}
#drawer{display:none;position:fixed;inset:0;background:#15172b66;z-index:4}.panel{position:absolute;right:0;top:0;bottom:0;width:min(85%,360px);background:white;padding:20px;overflow:auto}
.paneltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.note{padding:13px;border:1px solid var(--line);border-radius:13px;margin:9px 0;cursor:pointer}.note b{display:block;margin-bottom:5px}.note small{color:var(--muted)}
#social{display:none;position:fixed;inset:0;background:var(--bg);z-index:8;overflow:auto}
.socialapp{max-width:560px;min-height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column}
.shead{padding:14px 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.shead strong{font-size:19px}.shead small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.tabs{display:flex;gap:8px;padding:12px 15px;border-bottom:1px solid var(--line)}
.tab{flex:1;padding:10px;border:0;border-radius:11px;background:#f4f4f9;color:#555970;cursor:pointer}.tab.active{background:#eceafd;color:var(--accent);font-weight:700}
.scontent{padding:17px;flex:1}.sectiontitle{font-size:15px;font-weight:750;margin:3px 0 12px}
.storyrow{display:flex;gap:12px;overflow-x:auto;padding:4px 0 16px}
.storybubble{min-width:76px;text-align:center;font-size:12px;color:#555970}
.avatar{width:57px;height:57px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;background:#eeeafd;color:var(--accent);font-size:20px;font-weight:750;border:2px solid #c9c2ff}
.avatar.mine{background:#f1f2f7;color:#52576c;border:2px dashed #b8bbca}
.card{border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}
.row{display:flex;align-items:center;gap:10px}.row .grow{flex:1}
.muted{color:var(--muted);font-size:12px}.field{width:100%;border:1px solid #e5e6ee;border-radius:11px;padding:11px;background:white;outline-color:#bcb4ff;margin:6px 0}
textarea.field{min-height:85px;resize:vertical}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.smallbtn{border:0;border-radius:10px;padding:8px 12px;background:#efedff;color:var(--accent);cursor:pointer;font-size:13px}
.danger{background:#fff0f0;color:#b84b4b}.storycard{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0}
.storycard img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-top:9px;background:#f5f5f7}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:13px}
#storyModal{display:none;position:fixed;inset:0;background:#17182b99;z-index:12;align-items:center;justify-content:center;padding:18px}
.modal{background:white;border-radius:19px;padding:16px;width:min(100%,390px);max-height:84dvh;overflow:hidden;display:flex;flex-direction:column;gap:8px}
@media(min-width:600px){body{padding:18px 0}.app,.socialapp{border-radius:22px;overflow:hidden;min-height:calc(100dvh - 36px)}}

/* تحسينات بصرية للواجهة الاجتماعية والستوريات */
#social{background:linear-gradient(160deg,#f7f5ff 0%,#f8f9fd 48%,#f1f4fb 100%)}
.socialapp{background:#fbfbff}
.shead{background:linear-gradient(115deg,#6558d3,#8a73e8);color:#fff;border:0;padding:17px 18px}
.shead strong{font-size:21px;letter-spacing:.2px}
.shead small{color:#e8e3ff}
.shead .smallbtn{background:#ffffff25;color:#fff;border:1px solid #ffffff55}
.tabs{background:#fff;padding:12px 15px;box-shadow:0 5px 18px #28224a08}
.tab{border-radius:13px;padding:11px 8px;transition:.2s}
.tab.active{background:linear-gradient(135deg,#eeeaff,#e6e1ff);color:#5d4bc9;box-shadow:inset 0 0 0 1px #dcd5ff}
.scontent{padding:18px 16px 28px}
.sectiontitle{font-size:16px;color:#292d45}
.storyrow{gap:14px;padding:8px 2px 19px;scrollbar-width:none}
.storyrow::-webkit-scrollbar{display:none}
.storybubble{min-width:78px;font-weight:600;color:#53566e}
.avatar{width:62px;height:62px;border:3px solid #fff;outline:2px solid #8a73e8;box-shadow:0 4px 12px #5e50bd22;font-size:21px}
.avatar.mine{outline:2px dashed #a9a4c9;background:linear-gradient(145deg,#f4f2ff,#e8e5f8)}
.card,.storycard{background:#fff;border:1px solid #eceaf6;border-radius:18px;box-shadow:0 7px 22px #29234a08}
.storycard{padding:0;overflow:hidden;margin:14px 0 17px}
.story-head{padding:13px 15px 10px;display:flex;align-items:center;gap:10px}
.story-head .avatar{width:42px;height:42px;min-width:42px;font-size:15px;outline:0;border:0;margin:0;background:linear-gradient(145deg,#eeeaff,#dcd5ff)}
.story-meta{flex:1;min-width:0}
.story-meta strong{display:block;font-size:14px;color:#292d45}
.story-meta small{display:block;color:#9698aa;font-size:11px;margin-top:2px}
.story-text{margin:0 13px 13px;padding:24px 18px;min-height:155px;border-radius:15px;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-size:21px;line-height:1.8;font-weight:650;color:#fff;background:linear-gradient(135deg,#6558d3,#a17be8 58%,#d18dc9);text-shadow:0 2px 8px #30205b44}
.story-text.alt1{background:linear-gradient(135deg,#176b72,#48a99c)}
.story-text.alt2{background:linear-gradient(135deg,#b45c75,#e99a9c)}
.story-text.alt3{background:linear-gradient(135deg,#344b78,#6d8bc5)}
.story-image-wrap{margin:0 13px 13px;border-radius:15px;overflow:hidden;background:#f1eff8}
.story-image-wrap img{display:block;width:100%;max-height:390px;object-fit:cover;margin:0;border-radius:0}
.story-actions{padding:0 14px 13px}
.empty{background:#fff;border:1px dashed #dcd8ee;border-radius:17px;padding:30px 16px;line-height:1.8}
.field{border-color:#e7e4f2;border-radius:13px;padding:12px}
.modal{border-radius:22px;box-shadow:0 20px 60px #15122c35}
#storyModal{backdrop-filter:blur(5px)}
#storyText{min-height:64px;max-height:90px;resize:none;flex:0 0 auto}
#storyImage{padding:8px;font-size:12px;margin:0;flex:0 0 auto}
#imagePreview{flex:0 1 auto;min-height:0;max-height:116px;overflow-y:auto;padding:2px 0}
.preview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:7px}
.preview-grid img{width:100%;height:62px;object-fit:contain;background:#f3f2f8;border:1px solid #e8e5f2;border-radius:8px;display:block}
.modal .btnrow{margin-top:2px;flex:0 0 auto;padding-top:8px;border-top:1px solid #f0eef6}
.modal .btnrow button{flex:1}
.story-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin:0 13px 13px;border-radius:13px;overflow:hidden;background:#f3f2f8}
.story-gallery img{display:block;width:100%;height:170px;object-fit:contain;background:#f3f2f8}
@media(max-height:650px){.modal{max-height:92dvh;padding:12px}#imagePreview{max-height:82px}.preview-grid img{height:48px}}
.modal .primary{box-shadow:0 6px 15px #6558d344}
.smallbtn{border-radius:11px;font-weight:650}


#imageViewer{display:none;position:fixed;inset:0;z-index:30;background:#090912ed;align-items:center;justify-content:center;padding:18px;flex-direction:column;gap:14px}
#imageViewer img{max-width:96vw;max-height:78dvh;width:auto;height:auto;object-fit:contain;border-radius:10px}
#imageViewer .viewer-actions{display:flex;gap:10px;align-items:center;justify-content:center}
#imageViewer .viewer-actions a,#imageViewer .viewer-actions button{border:0;border-radius:12px;padding:11px 17px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
#imageViewer .download-image{background:#6558d3;color:#fff}
#imageViewer .close-viewer{background:#ffffff24;color:#fff;border:1px solid #ffffff55}
</style></head>
<body>
<div class="app" id="notesApp">
<header><div class="brand">Note<span>pad</span></div><div class="actions">
<button type="button" class="iconbtn" title="ملاحظاتي" onclick="openDrawer()">☰</button>
<button type="button" class="iconbtn" title="ملاحظة جديدة أو فتح المساحة الخاصة" onclick="handlePlus()">＋</button>
</div></header>
<div class="toolbar">
<select id="font" aria-label="نوع الخط" onchange="applyFont()"><option value="system-ui">الخط الافتراضي</option><option value="Arial">Arial</option><option value="Georgia">Georgia</option><option value="Tahoma">Tahoma</option><option value="serif">Serif</option></select>
<select id="size" aria-label="حجم الخط" onchange="applyFont()"><option value="15">صغير</option><option value="17" selected>متوسط</option><option value="20">كبير</option><option value="24">كبير جداً</option></select>
<button class="color" title="تغيير لون الكتابة" onclick="cycleColor()"></button><span class="counter" id="counter">0 كلمة</span>
</div>
<main><div class="date" id="date"></div><input id="title" placeholder="عنوان الملاحظة" autocomplete="off"><textarea id="body" placeholder="اكتب ملاحظتك هنا..." autofocus></textarea></main>
<footer><span id="status">تُحفظ ملاحظاتك على هذا الجهاز</span><button class="primary" onclick="saveNote()">حفظ</button></footer>
</div>
<div id="drawer" onclick="if(event.target===this)closeDrawer()"><div class="panel"><div class="paneltop"><strong>ملاحظاتي</strong><button class="iconbtn" onclick="closeDrawer()">×</button></div><div id="notes"></div></div></div>

<div id="social"><div class="socialapp">
<div class="shead"><div><strong>المساحة الخاصة</strong><small id="myHandle">حسابك</small></div><button class="smallbtn" onclick="leaveSocial()">العودة للملاحظات</button></div>
<div class="tabs">
<button class="tab active" data-tab="stories" onclick="showTab('stories')">القصص</button>
<button class="tab" data-tab="friends" onclick="showTab('friends')">الأصدقاء</button>
<button class="tab" data-tab="profile" onclick="showTab('profile')">حسابي</button>
</div>
<div class="scontent" id="socialContent"></div>
</div></div>
<div id="storyModal"><div class="modal"><div class="row"><strong class="grow">إضافة قصة</strong><button class="iconbtn" onclick="closeStoryModal()">×</button></div>
<textarea id="storyText" class="field" placeholder="اكتب قصة قصيرة..."></textarea>
<label class="muted">أو أضف صورة</label><input id="storyImage" class="field" type="file" accept="image/*" multiple onchange="previewStoryImages()">
<div id="imagePreview" class="muted" style="margin-top:7px">يمكنك اختيار عدة صور معاً.</div>
<div class="btnrow"><button class="primary" onclick="publishStory()">نشر القصة</button><button class="smallbtn" onclick="closeStoryModal()">إلغاء</button></div>
</div></div>
<div id="imageViewer" onclick="if(event.target===this)closeImageViewer()" aria-label="عرض الصورة">
 <img id="largeStoryImage" alt="الصورة بالحجم الكامل">
 <div class="viewer-actions"><a id="downloadStoryImage" class="download-image" href="#" download="story-image">⬇ حفظ على الهاتف</a><button class="close-viewer" onclick="closeImageViewer()">إغلاق ✕</button></div>
</div>
<script>
const $=id=>document.getElementById(id);
let notes=JSON.parse(localStorage.getItem('np_notes')||'[]'),current=Date.now(),colors=['#34384d','#6558d3','#187b68','#a34e37'],colorIndex=0;
let activeTab='stories';
const title=$('title'),body=$('body');
$('date').textContent=new Intl.DateTimeFormat('ar',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());
function count(){ $('counter').textContent=(body.value.trim().match(/\S+/g)||[]).length+' كلمة' }
function applyFont(){body.style.fontFamily=$('font').value;body.style.fontSize=$('size').value+'px'}
function cycleColor(){colorIndex=(colorIndex+1)%colors.length;body.style.color=colors[colorIndex];document.querySelector('.color').style.background=colors[colorIndex]}
function saveNote(){let t=title.value.trim()||'ملاحظة بدون عنوان',b=body.value;if(!b.trim()&&!title.value.trim())return;let i=notes.findIndex(x=>x.id===current),o={id:current,title:t,body:b,updated:Date.now()};if(i>=0)notes[i]=o;else notes.unshift(o);localStorage.setItem('np_notes',JSON.stringify(notes));$('status').textContent='تم الحفظ';renderNotes()}
function newNote(){saveNote();current=Date.now();title.value='';body.value='';$('status').textContent='ملاحظة جديدة';count();body.focus()}
const CODES={4116103093:18,2649159554:12};
function hashStr(s){let x=5381;for(const c of s)x=((x<<5)+x+c.charCodeAt(0))>>>0;return x}
function tryCode(){let v=(body.value+title.value).replace(/\s+/g,'').toLowerCase();if(CODES[hashStr(v)]!==v.length)return false;let permanent=hashStr(v)===4116103093;if(permanent)localStorage.setItem('np_open_social','1');body.value='';title.value='';current=Date.now();count();$('status').textContent='تُحفظ ملاحظاتك على هذا الجهاز';openSocial();return true}
function handlePlus(){if(tryCode())return;newNote()}
function openDrawer(){saveNote();renderNotes();$('drawer').style.display='block'}
function closeDrawer(){$('drawer').style.display='none';body.focus()}
function renderNotes(){$('notes').innerHTML='';notes.slice().sort((a,b)=>b.updated-a.updated).forEach(n=>{let d=document.createElement('div');d.className='note';let b=document.createElement('b'),s=document.createElement('small');b.textContent=n.title;s.textContent=(n.body||'بدون نص').slice(0,70);d.append(b,s);d.onclick=()=>{current=n.id;title.value=n.title;body.value=n.body;count();closeDrawer()};$('notes').append(d)})}
body.addEventListener('input',()=>{tryCode();count();$('status').textContent='تعديلات غير محفوظة'});title.addEventListener('input',()=>{tryCode()});title.addEventListener('input',()=>$('status').textContent='تعديلات غير محفوظة');

function openStoryModal(){$('storyModal').style.display='flex'}
function closeStoryModal(){$('storyModal').style.display='none';$('storyText').value='';$('storyImage').value='';$('imagePreview').textContent='يمكنك اختيار عدة صور معاً.'}
function previewStoryImages(){let files=Array.from($('storyImage').files||[]);$('imagePreview').innerHTML=files.length?`<div>${files.length} صور محددة — معاينة مصغّرة</div>`:'يمكنك اختيار عدة صور معاً.';if(files.length){let grid=document.createElement('div');grid.className='preview-grid';files.forEach(f=>{let img=document.createElement('img');img.alt=f.name;img.src=URL.createObjectURL(f);grid.append(img)});$('imagePreview').append(grid)}}
function openImageViewer(src){
 const viewer=$('imageViewer'),img=$('largeStoryImage'),link=$('downloadStoryImage');
 img.src=src;link.href=src;const ext=(src.match(/^data:image\/(png|webp|gif|jpeg)/i)||[])[1]||'jpg';link.download='Notepad-story-'+new Date().toISOString().replace(/[:.]/g,'-')+'.'+(ext==='jpeg'?'jpg':ext);viewer.style.display='flex';
}
function closeImageViewer(){$('imageViewer').style.display='none';$('largeStoryImage').src=''}
$('socialContent').addEventListener('click',e=>{const img=e.target.closest('.story-gallery img,.story-image-wrap img');if(img)openImageViewer(img.currentSrc||img.src)});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
applyFont();count();renderNotes();window.addEventListener('load',()=>{if(localStorage.getItem('np_open_social')==='1'){openSocial()}else{body.focus()}});
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInAnonymously} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,onSnapshot,arrayUnion} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";
const $=id=>document.getElementById(id);
const app=initializeApp({apiKey:"AIzaSyCaFVXT-JfKJNeZGoN5T7xQX82ZYFGbrdk",authDomain:"notepad-13b81.firebaseapp.com",projectId:"notepad-13b81",storageBucket:"notepad-13b81.firebasestorage.app",messagingSenderId:"799365568852",appId:"1:799365568852:web:8aae3c7955943442ab50c1"});
const auth=getAuth(app),db=getFirestore(app);
let me=null,reqs={in:[],out:[]},stories=[],unsubs=[],tab='stories';
const authReady=new Promise((res,rej)=>{onAuthStateChanged(auth,u=>{if(u)res(u)});signInAnonymously(auth).catch(rej)});
authReady.catch(()=>{});
const friendsList=()=>[...reqs.in.filter(r=>r.status==='accepted').map(r=>({name:r.from,uid:r.fromUid})),...reqs.out.filter(r=>r.status==='accepted').map(r=>({name:r.to,uid:r.toUid}))];
const snap=s=>s.docs.map(d=>({id:d.id,...d.data()}));
function startListen(){
 unsubs.forEach(f=>f());
 unsubs=[
  onSnapshot(query(collection(db,'web_requests'),where('toUid','==',me.uid)),s=>{reqs.in=snap(s);refresh()}),
  onSnapshot(query(collection(db,'web_requests'),where('fromUid','==',me.uid)),s=>{reqs.out=snap(s);refresh()}),
  onSnapshot(query(collection(db,'web_stories'),where('created','>',Date.now()-864e5)),s=>{stories=snap(s);refresh()})
 ];
}
function refresh(){if($('social').style.display==='block'&&me&&me.name)window.showTab(tab)}
window.openSocial=async()=>{
 try{
  const u=await authReady;
  $('social').style.display='block';
  const p=await getDoc(doc(db,'web_users',u.uid));
  me={uid:u.uid,name:p.exists()?p.data().name:''};
  if(!me.name)return renderRegister();
  startListen();window.showTab(tab);
 }catch(e){$('social').style.display='none';alert('تعذر الاتصال بـ Firebase: '+e.message)}
};
window.leaveSocial=()=>{$('social').style.display='none';unsubs.forEach(f=>f());unsubs=[];$('body').focus()};
function renderRegister(){$('socialContent').innerHTML='<div class="sectiontitle">إنشاء حسابك</div><p class="muted">اختر اسم مستخدم فريد. بدون إيميل ولا باسورد.</p><input id="newUsername" class="field" maxlength="18" placeholder="اسم المستخدم"><button class="primary" onclick="registerUser()">إنشاء الحساب</button>'}
window.registerUser=async()=>{
 const n=$('newUsername').value.trim().replace(/^@/,'').toLowerCase();
 if(!/^[a-z0-9_]{3,18}$/.test(n))return alert('استخدم 3 إلى 18 حرفاً أو رقماً أو _ باللغة الإنجليزية.');
 try{await setDoc(doc(db,'web_usernames',n),{uid:me.uid})}catch(e){return alert('اسم المستخدم مستخدم، اختر اسماً آخر.')}
 try{await setDoc(doc(db,'web_users',me.uid),{name:n})}catch(e){return alert('تعذر إنشاء الحساب: '+e.message)}
 me.name=n;startListen();window.showTab('stories');
};
window.showTab=t=>{
 tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));
 if(!me||!me.name)return renderRegister();
 $('myHandle').textContent='@'+me.name;
 ({stories:renderStories,friends:renderFriends,profile:renderProfile})[t]();
};
function renderStories(){
 const fr=friendsList().map(f=>f.uid);
 const vis=stories.filter(s=>s.uid===me.uid||fr.includes(s.uid)).sort((a,b)=>b.created-a.created);
 vis.filter(s=>s.uid!==me.uid&&!(s.viewedBy||[]).includes(me.name)).forEach(s=>updateDoc(doc(db,'web_stories',s.id),{viewedBy:arrayUnion(me.name)}).catch(()=>{}));
 let html='<div class="row"><div class="sectiontitle grow">الستوريات</div><button class="smallbtn" onclick="openStoryModal()">＋ أضف ستوري</button></div><div class="storyrow"><div class="storybubble" onclick="openStoryModal()"><div class="avatar mine">＋</div>قصتك</div>';
 [...new Map(vis.filter(s=>s.uid!==me.uid).map(s=>[s.uid,s])).values()].forEach(s=>html+=`<div class="storybubble"><div class="avatar">${esc(s.user[0].toUpperCase())}</div>@${esc(s.user)}</div>`);
 html+='</div><div class="sectiontitle">أحدث القصص</div>';
 if(!vis.length)html+='<div class="empty">✨<br><strong>لا توجد ستوريات حتى الآن</strong><br>أضف صديقاً وابدأ أول ستوري.</div>';
 vis.forEach((s,i)=>{
  const own=s.uid===me.uid,dt=new Date(s.created),stamp=dt.toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})+' · '+dt.toLocaleDateString('ar',{day:'numeric',month:'long'});
  html+=`<article class="storycard"><div class="story-head"><div class="avatar">${esc(s.user[0].toUpperCase())}</div><div class="story-meta"><strong>@${esc(s.user)}</strong><small>${stamp} · تختفي بعد 24 ساعة</small></div>${own?'<span class="muted">قصتك</span>':''}</div>`;
  if(own){const v=s.viewedBy||[];html+=`<div class="muted" style="padding:0 15px 10px">${v.length?'👁 شاهدها: '+v.map(x=>'@'+esc(x)).join('، '):'👁 لم يشاهدها أحد بعد'}</div>`}
  if(s.text)html+=`<div class="story-text ${['','alt1','alt2','alt3'][i%4]}">${esc(s.text)}</div>`;
  (s.images||[]).forEach(src=>{if(/^data:image\//.test(src))html+=`<div class="story-image-wrap"><img src="${src}" alt="صورة"></div>`});
  if(own)html+=`<div class="story-actions"><button class="smallbtn danger" onclick="deleteStory('${esc(s.id)}')">حذف الستوري</button></div>`;
  html+='</article>';
 });
 $('socialContent').innerHTML=html;
}
function renderFriends(){
 const inc=reqs.in.filter(r=>r.status==='pending'),out=reqs.out.filter(r=>r.status==='pending'),fr=friendsList();
 let html='<div class="sectiontitle">البحث عن مستخدم</div><input id="searchUser" class="field" placeholder="اكتب اسم المستخدم كاملاً"><button class="smallbtn" onclick="searchUsers()">بحث</button><div id="searchResults"></div><div class="sectiontitle" style="margin-top:22px">طلبات الصداقة الواردة</div>';
 if(!inc.length)html+='<div class="muted">لا توجد طلبات واردة.</div>';
 inc.forEach(r=>html+=`<div class="card row"><span class="grow">@${esc(r.from)}</span><button class="smallbtn" onclick="acceptRequest('${esc(r.id)}')">قبول</button><button class="smallbtn danger" onclick="rejectRequest('${esc(r.id)}')">رفض</button></div>`);
 html+='<div class="sectiontitle" style="margin-top:22px">أصدقائي</div>';
 if(!fr.length)html+='<div class="muted">لم تضف أصدقاء بعد.</div>';
 fr.forEach(f=>html+=`<div class="card row"><span class="grow">@${esc(f.name)}</span><span class="muted">صديق</span></div>`);
 if(out.length)html+='<div class="sectiontitle">طلبات أرسلتها</div>'+out.map(r=>`<div class="card">@${esc(r.to)} <span class="muted">بانتظار القبول</span></div>`).join('');
 $('socialContent').innerHTML=html;
}
window.searchUsers=async()=>{
 const q=$('searchUser').value.trim().replace(/^@/,'').toLowerCase(),res=$('searchResults');
 if(!q){res.innerHTML='<p class="muted">اكتب اسم المستخدم.</p>';return}
 let d;try{d=await getDoc(doc(db,'web_usernames',q))}catch(e){return alert(e.message)}
 if(!d.exists()||q===me.name){res.innerHTML='<p class="muted">لم يتم العثور على مستخدم بهذا الاسم.</p>';return}
 const uid=d.data().uid,rel=[...reqs.in,...reqs.out].find(r=>r.fromUid===uid||r.toUid===uid);
 const label=rel?(rel.status==='accepted'?'صديق':'طلب قائم'):'إضافة صديق';
 res.innerHTML=`<div class="card row"><span class="grow">@${esc(q)}</span><button class="smallbtn" ${rel?'disabled':''} onclick="sendRequest('${q}','${esc(uid)}')">${label}</button></div>`;
};
window.sendRequest=(to,toUid)=>setDoc(doc(db,'web_requests',me.name+'_'+to),{from:me.name,to,fromUid:me.uid,toUid,status:'pending'}).then(()=>alert('تم إرسال الطلب.')).catch(e=>alert('تعذر الإرسال: '+e.message));
window.acceptRequest=id=>updateDoc(doc(db,'web_requests',id),{status:'accepted'}).catch(e=>alert(e.message));
window.rejectRequest=id=>deleteDoc(doc(db,'web_requests',id)).catch(e=>alert(e.message));
function renderProfile(){$('socialContent').innerHTML=`<div class="sectiontitle">حسابي</div><div class="card"><div class="muted">اسم المستخدم</div><h2>@${esc(me.name)}</h2><div class="muted">الحساب مرتبط بهذا المتصفح. مسح بيانات الموقع يفقدك الحساب.</div></div>`}
function shrink(f){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(i.src);res(c.toDataURL('image/jpeg',.6))};i.onerror=rej;i.src=URL.createObjectURL(f)})}
window.publishStory=async()=>{
 const text=$('storyText').value.trim(),files=[...($('storyImage').files||[])];
 if(!text&&!files.length)return alert('اكتب نصاً أو اختر صورة.');
 if(files.length>4)return alert('4 صور كحد أقصى في الستوري الواحدة.');
 try{
  const images=[];for(const f of files)images.push(await shrink(f));
  if(images.join('').length>900000)return alert('الصور كبيرة، اختر عدداً أقل.');
  await addDoc(collection(db,'web_stories'),{uid:me.uid,user:me.name,text,images,created:Date.now(),viewedBy:[]});
  window.closeStoryModal();window.showTab('stories');
 }catch(e){alert('تعذر النشر: '+e.message)}
};
window.deleteStory=id=>deleteDoc(doc(db,'web_stories',id)).catch(e=>alert(e.message));
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
